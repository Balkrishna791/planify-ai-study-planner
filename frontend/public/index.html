    <!--
      manifest.json provides metadata used when your web app is installed on a

    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Planify",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "An AI study planner that uses subjects, syllabi, previous-year papers, exam dates and sleep schedules to create practical weekly study plans."
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <title>Planify - AI Academic Planner</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script>
      // A legacy cache-first service worker made the development server serve
      // stale bundles after source changes. Remove it once for every origin;
      // production offline support should be added later with a versioned,
      // build-integrated PWA setup instead of this hand-written cache.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations()
            .then(registrations => Promise.all(registrations.map(registration => registration.unregister())))
            .then(() => caches.keys())
            .then(cacheNames => Promise.all(cacheNames
              .filter(cacheName => cacheName.startsWith('planify-'))
              .map(cacheName => caches.delete(cacheName))))
            .catch(() => {
              // A cache cleanup failure must never block Planify from loading.
            });
        });
      }
    </script>
  </body>
